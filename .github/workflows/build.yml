name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Backup lib and assets
        run: |
          mkdir -p /tmp/sifir_backup
          cp -r lib /tmp/sifir_backup/lib
          cp -r assets /tmp/sifir_backup/assets
          cp pubspec.yaml /tmp/sifir_backup/pubspec.yaml
          cp analysis_options.yaml /tmp/sifir_backup/analysis_options.yaml || true

      - name: Clean workspace
        run: |
          rm -rf lib assets pubspec.yaml analysis_options.yaml android ios web linux macos windows test

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.sifir --project-name sifir --platforms=android .

      - name: Remove default lib
        run: rm -rf lib

      - name: Restore project files
        run: |
          cp -r /tmp/sifir_backup/lib lib
          cp -r /tmp/sifir_backup/assets assets
          cp /tmp/sifir_backup/pubspec.yaml pubspec.yaml
          cp /tmp/sifir_backup/analysis_options.yaml analysis_options.yaml || true

      - name: Set app label
        run: |
          sed -i 's/android:label="sifir"/android:label="SIFIR"/g' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

  build:
    needs: analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Backup lib and assets
        run: |
          mkdir -p /tmp/sifir_backup
          cp -r lib /tmp/sifir_backup/lib
          cp -r assets /tmp/sifir_backup/assets
          cp pubspec.yaml /tmp/sifir_backup/pubspec.yaml
          cp analysis_options.yaml /tmp/sifir_backup/analysis_options.yaml || true

      - name: Clean workspace
        run: |
          rm -rf lib assets pubspec.yaml analysis_options.yaml android ios web linux macos windows test

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.sifir --project-name sifir --platforms=android .

      - name: Remove default lib
        run: rm -rf lib

      - name: Restore project files
        run: |
          cp -r /tmp/sifir_backup/lib lib
          cp -r /tmp/sifir_backup/assets assets
          cp /tmp/sifir_backup/pubspec.yaml pubspec.yaml
          cp /tmp/sifir_backup/analysis_options.yaml analysis_options.yaml || true

      - name: Set app label
        run: |
          sed -i 's/android:label="sifir"/android:label="SIFIR"/g' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sifir-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
